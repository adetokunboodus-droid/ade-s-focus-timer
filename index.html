<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ade Focus Timer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      color: #111;
    }

    .timer-card {
      width: min(92vw, 460px);
      background: white;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.10);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .label {
      min-height: 24px;
      margin-bottom: 18px;
      color: #666;
      font-size: 15px;
    }

    .time {
      font-size: 76px;
      font-weight: 700;
      letter-spacing: 2px;
      margin: 10px 0 22px;
      font-variant-numeric: tabular-nums;
    }

    .status {
      min-height: 24px;
      margin-bottom: 22px;
      font-size: 14px;
      color: #666;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: #111;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .secondary {
      background: #e9e9e9;
      color: #111;
    }

    .danger {
      background: #d9d9d9;
      color: #111;
    }

    .settings {
      margin-top: 22px;
      display: grid;
      gap: 10px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
    }

    .alert-button {
      margin-top: 12px;
      width: 100%;
      background: #111;
    }

    .small {
      margin-top: 16px;
      color: #888;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="timer-card">

    <h1>Focus Timer</h1>

    <div id="timerLabel" class="label">
      No active focus block
    </div>

    <div id="timeDisplay" class="time">
      25:00
    </div>

    <div id="status" class="status">
      Ready
    </div>

    <div class="controls">

      <button id="startButton" onclick="startTimer()">
        Start
      </button>

      <button id="pauseButton"
              class="secondary"
              onclick="pauseTimer()"
              disabled>
        Pause
      </button>

      <button id="resumeButton"
              class="secondary"
              onclick="resumeTimer()"
              disabled>
        Resume
      </button>

      <button id="stopButton"
              class="danger"
              onclick="stopTimer()"
              disabled>
        Stop
      </button>

    </div>

    <div class="settings">

      <input
        id="durationInput"
        type="number"
        min="1"
        max="1440"
        value="25"
        placeholder="Minutes"
      >

      <input
        id="labelInput"
        type="text"
        maxlength="200"
        placeholder="Focus block label"
        value="Focus Block"
      >

    </div>

    <button
      id="alertsButton"
      class="alert-button"
      onclick="enableAlerts()">
      🔔 Enable Notifications & Sound
    </button>

    <div class="small">
      Keep this page open while using the timer.
      The timer synchronises with the central timer service.
    </div>

  </div>


<script>

  /* =========================================================
     CONFIGURATION
     ========================================================= */

  const API_URL =
    'https://script.google.com/macros/s/AKfycbxJMMURG_zF__mEpvKLzTibUvELUgfO_8LyDaTMJKRVDkTsQtpHkt8hnXq_f8BLNpS4/exec';


  /*
   * Active timers are checked regularly with the backend.
   *
   * Completion itself is NOT dependent on these polls.
   * The browser schedules completion directly from ends_at.
   */

  const ACTIVE_POLL_INTERVAL = 2000;
  const BACKGROUND_POLL_INTERVAL = 5000;


  /* =========================================================
     STATE
     ========================================================= */

  let currentTimer = null;

  let pollingTimer = null;

  let displayTimer = null;

  let completionTimer = null;

  let pollInProgress = false;

  let audioContext = null;

  let alertsEnabled = false;

  let completionHandledForEndsAt = null;

  let lastCompletedLabel = null;


  /* =========================================================
     ELEMENTS
     ========================================================= */

  const timeDisplay =
    document.getElementById('timeDisplay');

  const timerLabel =
    document.getElementById('timerLabel');

  const status =
    document.getElementById('status');

  const startButton =
    document.getElementById('startButton');

  const pauseButton =
    document.getElementById('pauseButton');

  const resumeButton =
    document.getElementById('resumeButton');

  const stopButton =
    document.getElementById('stopButton');

  const durationInput =
    document.getElementById('durationInput');

  const labelInput =
    document.getElementById('labelInput');

  const alertsButton =
    document.getElementById('alertsButton');


  /* =========================================================
     JSONP REQUEST
     ========================================================= */

  function apiRequest(action, params = {}) {

    return new Promise((resolve, reject) => {

      const callbackName =
        'timerCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );

      const script =
        document.createElement('script');

      const query =
        new URLSearchParams();

      query.set('api', '1');
      query.set('action', action);
      query.set('callback', callbackName);

      Object.keys(params).forEach(key => {

        if (
          params[key] !== undefined &&
          params[key] !== null
        ) {

          query.set(
            key,
            String(params[key])
          );

        }

      });


      let finished = false;


      const cleanup = () => {

        finished = true;

        try {
          delete window[callbackName];
        } catch (e) {}

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      };


      window[callbackName] =
        function(result) {

          if (finished) {
            return;
          }

          cleanup();

          resolve(result);

        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }

          cleanup();

          reject(
            new Error(
              'Timer service request failed'
            )
          );

        };


      script.src =
        API_URL +
        '?' +
        query.toString();

      document.body.appendChild(script);


      /*
       * Safety timeout.
       */

      setTimeout(() => {

        if (finished) {
          return;
        }

        cleanup();

        reject(
          new Error(
            'Timer service request timed out'
          )
        );

      }, 15000);

    });

  }


  /* =========================================================
     START TIMER
     ========================================================= */

  async function startTimer() {

    const minutes =
      Number(
        durationInput.value
      );


    if (
      !Number.isFinite(minutes) ||
      minutes <= 0 ||
      minutes > 1440
    ) {

      status.textContent =
        'Enter a duration between 1 and 1440 minutes.';

      return;

    }


    const label =
      labelInput.value.trim() ||
      'Focus Block';


    status.textContent =
      'Starting timer...';

    startButton.disabled = true;


    try {

      const result =
        await apiRequest(
          'start',
          {
            duration_seconds:
              Math.round(
                minutes * 60
              ),

            label:
              label
          }
        );


      if (!result.ok) {

        throw new Error(
          result.error ||
          'Unable to start timer'
        );

      }


      processTimerState(
        result
      );


      /*
       * Immediately ask the backend for the authoritative state.
       */

      await checkTimer();


    }

    catch (error) {

      console.error(error);

      status.textContent =
        'Unable to start timer.';

      startButton.disabled = false;

    }

  }


  /* =========================================================
     PAUSE TIMER
     ========================================================= */

  async function pauseTimer() {

    status.textContent =
      'Pausing...';

    pauseButton.disabled = true;


    try {

      const result =
        await apiRequest(
          'pause'
        );


      if (!result.ok) {

        throw new Error(
          result.error ||
          'Unable to pause timer'
        );

      }


      cancelCompletionSchedule();

      processTimerState(
        result
      );


    }

    catch (error) {

      console.error(error);

      status.textContent =
        error.message ||
        'Unable to pause timer.';

      pauseButton.disabled = false;

    }

  }


  /* =========================================================
     RESUME TIMER
     ========================================================= */

  async function resumeTimer() {

    status.textContent =
      'Resuming...';

    resumeButton.disabled = true;


    try {

      const result =
        await apiRequest(
          'resume'
        );


      if (!result.ok) {

        throw new Error(
          result.error ||
          'Unable to resume timer'
        );

      }


      processTimerState(
        result
      );


      /*
       * Re-synchronise immediately.
       */

      await checkTimer();


    }

    catch (error) {

      console.error(error);

      status.textContent =
        error.message ||
        'Unable to resume timer.';

      resumeButton.disabled = false;

    }

  }


  /* =========================================================
     STOP TIMER
     ========================================================= */

  async function stopTimer() {

    status.textContent =
      'Stopping...';

    stopButton.disabled = true;


    try {

      const result =
        await apiRequest(
          'stop'
        );


      cancelCompletionSchedule();

      currentTimer = null;

      processTimerState(
        result
      );


    }

    catch (error) {

      console.error(error);

      status.textContent =
        error.message ||
        'Unable to stop timer.';

      stopButton.disabled = false;

    }

  }


  /* =========================================================
     STATUS CHECK
     ========================================================= */

  async function checkTimer() {

    if (pollInProgress) {
      return;
    }

    pollInProgress = true;


    try {

      const result =
        await apiRequest(
          'status'
        );


      processTimerState(
        result
      );

    }

    catch (error) {

      console.error(
        'Status check failed:',
        error
      );

    }

    finally {

      pollInProgress = false;

    }

  }


  /* =========================================================
     PROCESS BACKEND STATE
     ========================================================= */

  function processTimerState(result) {

    if (!result) {
      return;
    }


    /*
     * Completed timer.
     *
     * This is mainly a fallback because the browser
     * normally handles completion from ends_at.
     */

    if (
      result.completed === true
    ) {

      currentTimer = null;

      cancelCompletionSchedule();

      handleTimerCompleted(
        result.label ||
        lastCompletedLabel ||
        'Focus Block'
      );

      updateButtons();

      return;

    }


    /*
     * No active timer.
     */

    if (
      result.active !== true
    ) {

      currentTimer = null;

      cancelCompletionSchedule();

      renderIdle();

      updateButtons();

      return;

    }


    /*
     * Active or paused timer.
     */

    currentTimer = {
      ...result
    };


    /*
     * Active timer with an end timestamp.
     */

    if (
      result.paused !== true &&
      result.ends_at
    ) {

      scheduleLocalCompletion(
        result
      );

    }


    /*
     * Paused timer.
     */

    else {

      cancelCompletionSchedule();

    }


    renderTimer();

    updateButtons();

  }


  /* =========================================================
     LOCAL COMPLETION SCHEDULER
     ========================================================= */

  function scheduleLocalCompletion(timer) {

    if (
      !timer ||
      !timer.ends_at
    ) {

      return;

    }


    const endsAt =
      Date.parse(
        timer.ends_at
      );


    if (
      !Number.isFinite(
        endsAt
      )
    ) {

      return;

    }


    /*
     * Do not schedule the same completion repeatedly.
     */

    if (
      completionHandledForEndsAt ===
      timer.ends_at
    ) {

      return;

    }


    cancelCompletionSchedule();


    const delay =
      Math.max(
        0,
        endsAt -
        Date.now()
      );


    /*
     * If the timer is already due, handle it immediately.
     */

    if (delay <= 50) {

      handleTimerCompleted(
        timer.label ||
        'Focus Block'
      );

      return;

    }


    /*
     * Store the exact completion timestamp.
     */

    completionTimer =
      setTimeout(
        () => {

          completionTimer =
            null;


          /*
           * Before announcing completion, check
           * whether the timer was paused or stopped.
           */

          if (
            !currentTimer ||
            currentTimer.paused === true
          ) {

            return;

          }


          /*
           * Check that the timer we are completing
           * is still the same timer.
           */

          if (
            currentTimer.ends_at !==
            timer.ends_at
          ) {

            return;

          }


          handleTimerCompleted(
            timer.label ||
            'Focus Block'
          );

        },
        delay
      );

  }


  /* =========================================================
     CANCEL LOCAL COMPLETION
     ========================================================= */

  function cancelCompletionSchedule() {

    if (
      completionTimer !== null
    ) {

      clearTimeout(
        completionTimer
      );

      completionTimer =
        null;

    }

  }


  /* =========================================================
     COMPLETION HANDLER
     ========================================================= */

  function handleTimerCompleted(label) {

    /*
     * Prevent duplicate completion handling.
     */

    const completionKey =
      currentTimer &&
      currentTimer.ends_at
        ? currentTimer.ends_at
        : String(label);


    if (
      completionHandledForEndsAt ===
      completionKey
    ) {

      return;

    }


    completionHandledForEndsAt =
      completionKey;


    lastCompletedLabel =
      label;


    currentTimer =
      null;


    cancelCompletionSchedule();


    /*
     * Update UI immediately.
     */

    timeDisplay.textContent =
      '00:00';

    timerLabel.textContent =
      label;

    status.textContent =
      'Focus block complete';


    document.title =
      '🔔 FOCUS BLOCK COMPLETE';


    updateButtons();


    /*
     * Fire both notification and sound.
     */

    showCompletionNotification(
      label
    );

    playCompletionSound();


    /*
     * Reset browser title after 15 seconds.
     */

    setTimeout(() => {

      if (
        document.title ===
        '🔔 FOCUS BLOCK COMPLETE'
      ) {

        document.title =
          'Ade Focus Timer';

      }

    }, 15000);

  }


  /* =========================================================
     DISPLAY TIMER
     ========================================================= */

  function renderTimer() {

    if (!currentTimer) {
      return;
    }


    timerLabel.textContent =
      currentTimer.label ||
      'Focus Block';


    if (
      currentTimer.paused === true
    ) {

      timeDisplay.textContent =
        formatSeconds(
          Number(
            currentTimer.remaining_seconds ||
            0
          )
        );

      status.textContent =
        'Paused';

      return;

    }


    if (
      currentTimer.ends_at
    ) {

      const remaining =
        Math.max(
          0,
          Math.ceil(
            (
              Date.parse(
                currentTimer.ends_at
              ) -
              Date.now()
            ) / 1000
          )
        );


      timeDisplay.textContent =
        formatSeconds(
          remaining
        );


      if (remaining > 0) {

        status.textContent =
          'Focus block running';

      }

    }

  }


  /* =========================================================
     DISPLAY CLOCK
     ========================================================= */

  function startDisplayClock() {

    if (
      displayTimer !== null
    ) {

      clearInterval(
        displayTimer
      );

    }


    displayTimer =
      setInterval(
        () => {

          if (!currentTimer) {
            return;
          }


          if (
            currentTimer.paused === true
          ) {

            renderTimer();

            return;

          }


          if (
            currentTimer.ends_at
          ) {

            const remaining =
              Math.max(
                0,
                Math.ceil(
                  (
                    Date.parse(
                      currentTimer.ends_at
                    ) -
                    Date.now()
                  ) / 1000
                )
              );


            timeDisplay.textContent =
              formatSeconds(
                remaining
              );


            /*
             * The completion alarm is scheduled
             * separately by scheduleLocalCompletion().
             */

          }

        },
        250
      );

  }


  /* =========================================================
     RENDER IDLE
     ========================================================= */

  function renderIdle() {

    timeDisplay.textContent =
      '25:00';

    timerLabel.textContent =
      'No active focus block';

    status.textContent =
      'Ready';

  }


  /* =========================================================
     BUTTON STATE
     ========================================================= */

  function updateButtons() {

    const active =
      currentTimer &&
      currentTimer.active === true;

    const paused =
      currentTimer &&
      currentTimer.paused === true;


    startButton.disabled =
      !!active;


    pauseButton.disabled =
      !active ||
      !!paused;


    resumeButton.disabled =
      !active ||
      !paused;


    stopButton.disabled =
      !active;

  }


  /* =========================================================
     FORMAT TIME
     ========================================================= */

  function formatSeconds(totalSeconds) {

    totalSeconds =
      Math.max(
        0,
        Math.floor(
          Number(
            totalSeconds
          ) || 0
        )
      );


    const minutes =
      Math.floor(
        totalSeconds / 60
      );

    const seconds =
      totalSeconds % 60;


    return (
      String(minutes)
        .padStart(2, '0') +
      ':' +
      String(seconds)
        .padStart(2, '0')
    );

  }


  /* =========================================================
     BACKEND POLLING
     ========================================================= */

  function startBackendPolling() {

    stopBackendPolling();


    const interval =
      document.hidden
        ? BACKGROUND_POLL_INTERVAL
        : ACTIVE_POLL_INTERVAL;


    pollingTimer =
      setInterval(
        checkTimer,
        interval
      );

  }


  function stopBackendPolling() {

    if (
      pollingTimer !== null
    ) {

      clearInterval(
        pollingTimer
      );

      pollingTimer =
        null;

    }

  }


  /* =========================================================
     AUDIO INITIALISATION
     ========================================================= */

  function initialiseAudio() {

    if (!audioContext) {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


      if (!AudioContext) {
        return false;
      }


      audioContext =
        new AudioContext();

    }


    if (
      audioContext.state ===
      'suspended'
    ) {

      audioContext.resume();

    }


    return true;

  }


  /* =========================================================
     SINGLE ALARM BURST
     ========================================================= */

  function playAlarmBurst() {

    if (!audioContext) {
      return;
    }


    if (
      audioContext.state ===
      'suspended'
    ) {

      audioContext.resume();

    }


    const now =
      audioContext.currentTime;


    const master =
      audioContext.createGain();


    master.gain.setValueAtTime(
      0.95,
      now
    );


    master.connect(
      audioContext.destination
    );


    const frequencies = [
      880,
      1174.66,
      880
    ];


    frequencies.forEach(
      (frequency, index) => {

        const oscillator =
          audioContext.createOscillator();

        const gain =
          audioContext.createGain();


        oscillator.type =
          'square';

        oscillator.frequency.value =
          frequency;


        const start =
          now +
          index * 0.18;

        const end =
          start +
          0.14;


        gain.gain.setValueAtTime(
          0.001,
          start
        );

        gain.gain.exponentialRampToValueAtTime(
          0.8,
          start + 0.015
        );

        gain.gain.exponentialRampToValueAtTime(
          0.001,
          end
        );


        oscillator.connect(
          gain
        );

        gain.connect(
          master
        );


        oscillator.start(
          start
        );

        oscillator.stop(
          end + 0.02
        );

      }
    );

  }


  /* =========================================================
     COMPLETION SOUND
     ========================================================= */

  function playCompletionSound() {

    initialiseAudio();


    /*
     * Five alarm bursts.
     */

    playAlarmBurst();

    setTimeout(
      playAlarmBurst,
      900
    );

    setTimeout(
      playAlarmBurst,
      1800
    );

    setTimeout(
      playAlarmBurst,
      2700
    );

    setTimeout(
      playAlarmBurst,
      3600
    );

  }


  /* =========================================================
     NOTIFICATION
     ========================================================= */

  function showCompletionNotification(label) {

    if (
      !('Notification' in window)
    ) {

      return;

    }


    if (
      Notification.permission !==
      'granted'
    ) {

      return;

    }


    try {

      const notification =
        new Notification(
          '🔔 Focus block complete',
          {
            body:
              (
                label ||
                'Your focus block'
              ) +
              ' has finished.',

            tag:
              'ade-focus-timer',

            renotify:
              true,

            requireInteraction:
              true
          }
        );


      notification.onclick =
        function() {

          window.focus();

          notification.close();

        };

    }

    catch (error) {

      console.error(
        'Notification failed:',
        error
      );

    }

  }


  /* =========================================================
     ENABLE NOTIFICATIONS + SOUND
     ========================================================= */

  async function enableAlerts() {

    /*
     * Audio must be initialised from a user gesture.
     */

    const audioReady =
      initialiseAudio();


    let notificationPermission =
      'unsupported';


    if (
      'Notification' in window
    ) {

      try {

        notificationPermission =
          await Notification.requestPermission();

      }

      catch (error) {

        console.error(
          error
        );

      }

    }


    alertsEnabled =
      audioReady ||
      notificationPermission ===
      'granted';


    if (
      notificationPermission ===
      'granted'
    ) {

      alertsButton.textContent =
        '🔔 Notifications Enabled';

    }

    else if (
      notificationPermission ===
      'denied'
    ) {

      alertsButton.textContent =
        '🔔 Sound Enabled — Notifications Blocked';

    }

    else {

      alertsButton.textContent =
        '🔔 Alerts Enabled';

    }


    /*
     * Confirmation sound.
     */

    if (audioReady) {

      playAlarmBurst();

    }


    status.textContent =
      'Alerts enabled';

  }


  /* =========================================================
     VISIBILITY CHANGE
     ========================================================= */

  document.addEventListener(
    'visibilitychange',
    () => {

      /*
       * Immediately reconcile with backend.
       */

      checkTimer();


      /*
       * Adjust polling frequency.
       */

      startBackendPolling();

    }
  );


  /* =========================================================
     WINDOW FOCUS
     ========================================================= */

  window.addEventListener(
    'focus',
    () => {

      checkTimer();

      startBackendPolling();

    }
  );


  /* =========================================================
     WINDOW LOAD
     ========================================================= */

  window.addEventListener(
    'load',
    () => {

      startDisplayClock();

      startBackendPolling();

      checkTimer();

    }
  );

</script>

</body>
</html>
