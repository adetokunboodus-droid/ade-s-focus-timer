<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ade Focus Timer</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: #f4f5f7;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 32px;

      box-shadow:
        0 10px 35px rgba(0,0,0,0.08);

      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #6b7280;
      font-size: 14px;
    }

    .timer {
      font-size: 76px;
      font-weight: 700;
      letter-spacing: -3px;
      margin: 20px 0;

      font-variant-numeric:
        tabular-nums;
    }

    .label {
      font-size: 17px;
      font-weight: 600;
      min-height: 24px;
      margin-bottom: 8px;
    }

    .status {
      font-size: 14px;
      color: #6b7280;
      min-height: 22px;
      margin-bottom: 22px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 10px;

      padding:
        12px 18px;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      background: #111827;
      color: white;

      transition:
        transform 0.1s ease,
        opacity 0.1s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .danger {
      background: #b91c1c;
    }

    .sound-button {
      margin-top: 18px;
      width: 100%;
      background: #374151;
    }

    .notification-status {
      margin-top: 10px;
      font-size: 13px;
      color: #6b7280;
      min-height: 20px;
    }

    .duration-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    input {
      flex: 1;
      min-width: 0;

      border:
        1px solid #d1d5db;

      border-radius: 10px;

      padding: 12px;

      font-size: 15px;

      text-align: center;
    }

    .start-manual {
      background: #2563eb;
    }

    .footer {
      margin-top: 24px;

      font-size: 12px;

      color: #9ca3af;

      line-height: 1.5;
    }

    @media (max-width: 480px) {

      .card {
        padding: 24px;
      }

      .timer {
        font-size: 60px;
      }

    }

  </style>

</head>


<body>


<div class="container">

  <div class="card">

    <h1>
      Ade Focus Timer
    </h1>

    <p class="subtitle">
      Shared with your GPT focus assistant
    </p>


    <div
      id="label"
      class="label"
    >
      No active timer
    </div>


    <div
      id="timer"
      class="timer"
    >
      00:00
    </div>


    <div
      id="status"
      class="status"
    >
      Ready
    </div>


    <div class="controls">

      <button
        id="pauseButton"
        onclick="pauseTimer()"
        disabled
      >
        Pause
      </button>


      <button
        id="resumeButton"
        onclick="resumeTimer()"
        disabled
      >
        Resume
      </button>


      <button
        id="stopButton"
        onclick="stopTimer()"
        disabled
        class="danger"
      >
        Stop
      </button>

    </div>


    <div class="duration-row">

      <input
        id="durationInput"
        type="number"
        min="1"
        max="1440"
        value="25"
        placeholder="Minutes"
      >

      <button
        class="start-manual"
        onclick="startManualTimer()"
      >
        Start
      </button>

    </div>


    <button
      id="alertButton"
      class="sound-button"
      onclick="enableAlerts()"
    >
      🔔 Enable Sound & Notifications
    </button>


    <div
      id="notificationStatus"
      class="notification-status"
    >
      Alerts not enabled
    </div>


    <div class="footer">

      Keep this page open in a browser tab.
      The timer synchronises with the GPT through the
      timer server.

    </div>

  </div>

</div>



<script>


/* =========================================================
   CONFIGURATION
   ========================================================= */


const API_URL =
  "https://script.google.com/macros/s/AKfycbxJMMURG_zF__mEpvKLzTibUvELUgfO_8LyDaTMJKRVDkTsQtpHkt8hnXq_f8BLNpS4/exec";


/*
 * Faster remote synchronisation:
 *
 * Active page:
 *     every 1 second
 *
 * Background page:
 *     every 2 seconds
 *
 * The browser may still throttle background JavaScript.
 */


const ACTIVE_POLL_INTERVAL =
  1000;


const BACKGROUND_POLL_INTERVAL =
  2000;


/* =========================================================
   STATE
   ========================================================= */


let currentTimer =
  null;


let displayInterval =
  null;


let backendPolling =
  null;


let audioContext =
  null;


let audioUnlocked =
  false;


let lastCompletedTimer =
  null;


let lastKnownEndsAt =
  null;


let lastKnownTimerStartedAt =
  null;


/*
 * Prevent overlapping API requests.
 */

let pollInProgress =
  false;


/* =========================================================
   DOM
   ========================================================= */


const timerElement =
  document.getElementById(
    "timer"
  );


const labelElement =
  document.getElementById(
    "label"
  );


const statusElement =
  document.getElementById(
    "status"
  );


const pauseButton =
  document.getElementById(
    "pauseButton"
  );


const resumeButton =
  document.getElementById(
    "resumeButton"
  );


const stopButton =
  document.getElementById(
    "stopButton"
  );


const notificationStatus =
  document.getElementById(
    "notificationStatus"
  );


const alertButton =
  document.getElementById(
    "alertButton"
  );


/* =========================================================
   AUDIO
   ========================================================= */


/*
 * Initialise Web Audio after a user interaction.
 *
 * This is important because Chrome/Safari can block
 * autoplay audio.
 */


function initialiseAudio() {

  try {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContextClass) {

      return false;

    }


    if (!audioContext) {

      audioContext =
        new AudioContextClass();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    audioUnlocked =
      true;


    return true;

  }

  catch (error) {

    console.error(
      "Audio initialisation failed:",
      error
    );

    return false;

  }

}


/* =========================================================
   SINGLE ALARM BURST
   ========================================================= */


function playAlarmBurst() {

  if (
    !audioContext
  ) {

    if (
      !initialiseAudio()
    ) {

      return;

    }

  }


  try {

    const now =
      audioContext.currentTime;


    /*
     * Master volume.
     *
     * This is intentionally substantially stronger
     * than the previous gentle chime.
     */


    const master =
      audioContext.createGain();


    master.gain.setValueAtTime(
      0.0001,
      now
    );


    master.gain.exponentialRampToValueAtTime(
      0.95,
      now + 0.025
    );


    master.gain.exponentialRampToValueAtTime(
      0.0001,
      now + 0.65
    );


    master.connect(
      audioContext.destination
    );


    /*
     * Tone 1.
     */

    const tone1 =
      audioContext.createOscillator();


    tone1.type =
      "square";


    tone1.frequency.setValueAtTime(
      880,
      now
    );


    tone1.connect(
      master
    );


    tone1.start(
      now
    );


    tone1.stop(
      now + 0.20
    );


    /*
     * Tone 2.
     */

    const tone2 =
      audioContext.createOscillator();


    tone2.type =
      "square";


    tone2.frequency.setValueAtTime(
      1174.66,
      now + 0.18
    );


    tone2.connect(
      master
    );


    tone2.start(
      now + 0.18
    );


    tone2.stop(
      now + 0.38
    );


    /*
     * Tone 3.
     */

    const tone3 =
      audioContext.createOscillator();


    tone3.type =
      "square";


    tone3.frequency.setValueAtTime(
      880,
      now + 0.36
    );


    tone3.connect(
      master
    );


    tone3.start(
      now + 0.36
    );


    tone3.stop(
      now + 0.58
    );


  }

  catch (error) {

    console.error(
      "Alarm playback failed:",
      error
    );

  }

}


/* =========================================================
   COMPLETION ALARM
   ========================================================= */


/*
 * Five alarm bursts.
 *
 * Approximate duration: 4.5 seconds.
 *
 * The repetition is deliberate: the objective is to get
 * Ade's attention rather than provide a gentle chime.
 */


function playCompletionSound() {

  initialiseAudio();


  playAlarmBurst();


  setTimeout(
    () => playAlarmBurst(),
    900
  );


  setTimeout(
    () => playAlarmBurst(),
    1800
  );


  setTimeout(
    () => playAlarmBurst(),
    2700
  );


  setTimeout(
    () => playAlarmBurst(),
    3600
  );

}


/* =========================================================
   ENABLE ALERTS
   ========================================================= */


async function enableAlerts() {

  /*
   * This button is a direct user gesture.
   * Use it to unlock Web Audio.
   */

  initialiseAudio();


  /*
   * Request notification permission.
   */

  if (
    "Notification" in window
  ) {

    try {

      const permission =
        await Notification.requestPermission();


      updateNotificationStatus(
        permission
      );

    }

    catch (error) {

      console.error(
        "Notification permission error:",
        error
      );

      updateNotificationStatus(
        "error"
      );

    }

  }


  /*
   * Play a confirmation sound so the user knows
   * the audio system is actually active.
   */

  playAlarmBurst();


  alertButton.textContent =
    "🔔 Sound & Notifications Enabled";


  if (
    "Notification" in window &&
    Notification.permission ===
      "granted"
  ) {

    notificationStatus.textContent =
      "🔔 Ready — completion alerts are enabled";

  }

}


/* =========================================================
   NOTIFICATION STATUS
   ========================================================= */


function updateNotificationStatus(
  permission
) {

  if (
    permission ===
    "granted"
  ) {

    notificationStatus.textContent =
      "🔔 Notifications enabled • completion alarm enabled";

  }

  else if (
    permission ===
    "denied"
  ) {

    notificationStatus.textContent =
      "🔕 Browser notifications are blocked";

  }

  else {

    notificationStatus.textContent =
      "Notifications not enabled";

  }

}


/* =========================================================
   COMPLETION NOTIFICATION
   ========================================================= */


function showCompletionNotification(
  label
) {

  if (
    !("Notification" in window)
  ) {

    return;

  }


  if (
    Notification.permission !==
    "granted"
  ) {

    return;

  }


  try {

    const notification =
      new Notification(
        "🔔 Focus block complete",
        {
          body:
            label
              ? label +
                " is complete."
              : "Your focus block is complete.",

          tag:
            "ade-focus-timer-complete",

          renotify:
            true,

          requireInteraction:
            true
        }
      );


    notification.onclick =
      function() {

        window.focus();

        notification.close();

      };


  }

  catch (error) {

    console.error(
      "Notification failed:",
      error
    );

  }

}


/* =========================================================
   COMPLETION HANDLER
   ========================================================= */


function handleTimerCompleted(
  label
) {

  /*
   * Construct a unique completion key.
   */

  const completionKey =
    String(
      lastKnownEndsAt ||
      lastKnownTimerStartedAt ||
      label ||
      Date.now()
    );


  /*
   * Prevent duplicate alerts caused by multiple
   * status polls seeing the same completed timer.
   */

  if (
    lastCompletedTimer ===
    completionKey
  ) {

    return;

  }


  lastCompletedTimer =
    completionKey;


  currentTimer =
    null;


  stopDisplayClock();


  timerElement.textContent =
    "00:00";


  labelElement.textContent =
    label ||
    "Focus block complete";


  statusElement.textContent =
    "Completed";


  updateButtons(
    false,
    false,
    false
  );


  /*
   * Native browser notification.
   */

  showCompletionNotification(
    label
  );


  /*
   * Strong web-audio alarm.
   */

  playCompletionSound();


  /*
   * Make the browser tab title conspicuous.
   */

  document.title =
    "🔔 FOCUS BLOCK COMPLETE";


  /*
   * Restore normal title after 15 seconds.
   */

  setTimeout(
    () => {

      document.title =
        "Ade Focus Timer";

    },
    15000
  );

}


/* =========================================================
   JSONP API
   ========================================================= */


function callApi(
  action,
  params = {}
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const callbackName =
        "timerCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams();


      query.set(
        "api",
        "1"
      );


      query.set(
        "action",
        action
      );


      query.set(
        "callback",
        callbackName
      );


      Object.keys(
        params
      ).forEach(
        key => {

          if (
            params[key] !== undefined &&
            params[key] !== null
          ) {

            query.set(
              key,
              params[key]
            );

          }

        }
      );


      let completed =
        false;


      function cleanup() {

        delete window[
          callbackName
        ];


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }

      }


      window[callbackName] =
        function(data) {

          if (
            completed
          ) {

            return;

          }


          completed =
            true;


          cleanup();


          resolve(
            data
          );

        };


      script.onerror =
        function() {

          if (
            completed
          ) {

            return;

          }


          completed =
            true;


          cleanup();


          reject(
            new Error(
              "Timer API request failed"
            )
          );

        };


      script.src =
        API_URL +
        "?" +
        query.toString();


      document.body.appendChild(
        script
      );

    }
  );

}


/* =========================================================
   START
   ========================================================= */


async function startTimer(
  durationSeconds,
  label
) {

  initialiseAudio();


  try {

    const result =
      await callApi(
        "start",
        {
          duration_seconds:
            durationSeconds,

          label:
            label ||
            "Focus Block"
        }
      );


    processTimerState(
      result
    );

  }

  catch (error) {

    console.error(
      error
    );


    statusElement.textContent =
      "Unable to start timer";

  }

}


/* =========================================================
   MANUAL START
   ========================================================= */


function startManualTimer() {

  initialiseAudio();


  const minutes =
    Number(
      document.getElementById(
        "durationInput"
      ).value
    );


  if (
    !Number.isFinite(minutes) ||
    minutes <= 0
  ) {

    alert(
      "Please enter a valid number of minutes."
    );

    return;

  }


  const seconds =
    Math.round(
      minutes * 60
    );


  startTimer(
    seconds,
    "Focus Block"
  );

}


/* =========================================================
   PAUSE
   ========================================================= */


async function pauseTimer() {

  try {

    const result =
      await callApi(
        "pause"
      );


    processTimerState(
      result
    );

  }

  catch (error) {

    console.error(
      error
    );

  }

}


/* =========================================================
   RESUME
   ========================================================= */


async function resumeTimer() {

  try {

    const result =
      await callApi(
        "resume"
      );


    processTimerState(
      result
    );

  }

  catch (error) {

    console.error(
      error
    );

  }

}


/* =========================================================
   STOP
   ========================================================= */


async function stopTimer() {

  try {

    await callApi(
      "stop"
    );


    currentTimer =
      null;


    lastKnownEndsAt =
      null;


    lastKnownTimerStartedAt =
      null;


    stopDisplayClock();


    timerElement.textContent =
      "00:00";


    labelElement.textContent =
      "No active timer";


    statusElement.textContent =
      "Stopped";


    updateButtons(
      false,
      false,
      false
    );


    document.title =
      "Ade Focus Timer";

  }

  catch (error) {

    console.error(
      error
    );

  }

}


/* =========================================================
   GET STATUS
   ========================================================= */


async function getStatus() {

  if (
    pollInProgress
  ) {

    return;

  }


  pollInProgress =
    true;


  try {

    const result =
      await callApi(
        "status"
      );


    processTimerState(
      result
    );

  }

  catch (error) {

    console.warn(
      "Timer status check failed:",
      error
    );

  }

  finally {

    pollInProgress =
      false;

  }

}


/* =========================================================
   PROCESS TIMER STATE
   ========================================================= */


function processTimerState(
  result
) {

  if (!result) {

    return;

  }


  /*
   * Completed timer.
   */

  if (
    result.completed ===
    true
  ) {

    handleTimerCompleted(
      result.label
    );

    return;

  }


  /*
   * No active timer.
   */

  if (
    result.active !==
    true
  ) {

    currentTimer =
      null;


    stopDisplayClock();


    timerElement.textContent =
      "00:00";


    labelElement.textContent =
      "No active timer";


    statusElement.textContent =
      "Ready";


    updateButtons(
      false,
      false,
      false
    );


    return;

  }


  /*
   * Active/paused timer.
   */

  currentTimer =
    result;


  lastKnownEndsAt =
    result.ends_at ||
    null;


  lastKnownTimerStartedAt =
    result.started_at ||
    null;


  labelElement.textContent =
    result.label ||
    "Focus Block";


  /*
   * PAUSED
   */

  if (
    result.paused ===
    true
  ) {

    stopDisplayClock();


    timerElement.textContent =
      formatTime(
        result.remaining_seconds
      );


    statusElement.textContent =
      "Paused";


    updateButtons(
      false,
      true,
      true
    );


    document.title =
      "⏸ " +
      formatTime(
        result.remaining_seconds
      ) +
      " • Focus Timer";


    return;

  }


  /*
   * RUNNING
   */

  statusElement.textContent =
    "Running";


  updateButtons(
    true,
    false,
    true
  );


  startDisplayClock();

}


/* =========================================================
   DISPLAY CLOCK
   ========================================================= */


function startDisplayClock() {

  if (
    displayInterval
  ) {

    return;

  }


  updateDisplay();


  displayInterval =
    setInterval(
      updateDisplay,
      1000
    );

}


/* =========================================================
   STOP DISPLAY CLOCK
   ========================================================= */


function stopDisplayClock() {

  if (
    displayInterval
  ) {

    clearInterval(
      displayInterval
    );


    displayInterval =
      null;

  }

}


/* =========================================================
   UPDATE DISPLAY
   ========================================================= */


function updateDisplay() {

  if (
    !currentTimer ||
    currentTimer.paused ||
    !currentTimer.ends_at
  ) {

    return;

  }


  const remaining =
    Math.max(
      0,
      Math.ceil(
        (
          Date.parse(
            currentTimer.ends_at
          ) -
          Date.now()
        ) / 1000
      )
    );


  timerElement.textContent =
    formatTime(
      remaining
    );


  document.title =
    formatTime(
      remaining
    ) +
    " • " +
    (
      currentTimer.label ||
      "Focus Timer"
    );


  /*
   * We intentionally do NOT trigger completion here.
   *
   * Apps Script remains the source of truth.
   */

  if (
    remaining <= 0
  ) {

    timerElement.textContent =
      "00:00";

  }

}


/* =========================================================
   FORMAT TIME
   ========================================================= */


function formatTime(
  totalSeconds
) {

  totalSeconds =
    Math.max(
      0,
      Math.floor(
        Number(
          totalSeconds
        ) || 0
      )
    );


  const hours =
    Math.floor(
      totalSeconds / 3600
    );


  const minutes =
    Math.floor(
      (
        totalSeconds % 3600
      ) / 60
    );


  const seconds =
    totalSeconds % 60;


  if (
    hours > 0
  ) {

    return (
      String(hours)
        .padStart(2, "0") +
      ":" +
      String(minutes)
        .padStart(2, "0") +
      ":" +
      String(seconds)
        .padStart(2, "0")
    );

  }


  return (
    String(minutes)
      .padStart(2, "0") +
    ":" +
    String(seconds)
      .padStart(2, "0")
  );

}


/* =========================================================
   BUTTON STATES
   ========================================================= */


function updateButtons(
  canPause,
  canResume,
  canStop
) {

  pauseButton.disabled =
    !canPause;


  resumeButton.disabled =
    !canResume;


  stopButton.disabled =
    !canStop;

}


/* =========================================================
   REMOTE POLLING
   ========================================================= */


/*
 * Restart the polling interval whenever the page changes
 * between foreground and background.
 */


function startBackendPolling() {

  stopBackendPolling();


  const interval =
    document.hidden
      ? BACKGROUND_POLL_INTERVAL
      : ACTIVE_POLL_INTERVAL;


  backendPolling =
    setInterval(
      checkTimer,
      interval
    );

}


/* =========================================================
   STOP POLLING
   ========================================================= */


function stopBackendPolling() {

  if (
    backendPolling
  ) {

    clearInterval(
      backendPolling
    );


    backendPolling =
      null;

  }

}


/* =========================================================
   CHECK TIMER
   ========================================================= */


async function checkTimer() {

  await getStatus();

}


/* =========================================================
   VISIBILITY
   ========================================================= */


/*
 * When the page becomes visible:
 *
 * 1. Check immediately.
 * 2. Switch to 1-second polling.
 *
 * When it becomes hidden:
 *
 * 1. Check immediately.
 * 2. Switch to 2-second polling.
 */


document.addEventListener(
  "visibilitychange",
  () => {

    getStatus();

    startBackendPolling();

  }
);


/* =========================================================
   WINDOW FOCUS
   ========================================================= */


window.addEventListener(
  "focus",
  () => {

    getStatus();

    startBackendPolling();

  }
);


/* =========================================================
   PAGE LOAD
   ========================================================= */


window.addEventListener(
  "load",
  () => {

    /*
     * Start remote synchronisation immediately.
     */

    startBackendPolling();


    /*
     * Get the current server state immediately.
     */

    getStatus();


    /*
     * Show current notification permission.
     */

    if (
      "Notification" in window
    ) {

      updateNotificationStatus(
        Notification.permission
      );

    }

  }
);


/* =========================================================
   AUDIO UNLOCK ON USER INTERACTION
   ========================================================= */


/*
 * Any user click is an opportunity to initialise the
 * Web Audio system.
 */


document.addEventListener(
  "click",
  () => {

    if (
      !audioUnlocked
    ) {

      initialiseAudio();

    }

  },
  {
    passive: true
  }
);


</script>


</body>

</html>
