<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ade Focus Timer</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 28px;
    }

    .timer {
      font-size: 72px;
      font-weight: 700;
      letter-spacing: 2px;
      margin: 24px 0;
    }

    .label {
      font-size: 18px;
      color: #4b5563;
      margin-bottom: 20px;
    }

    .status {
      min-height: 24px;
      margin: 12px 0 20px;
      font-weight: 600;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .start {
      background: #16a34a;
      color: white;
    }

    .pause {
      background: #f59e0b;
      color: white;
    }

    .resume {
      background: #2563eb;
      color: white;
    }

    .stop {
      background: #dc2626;
      color: white;
    }

    .notification {
      background: #111827;
      color: white;
      margin-top: 20px;
    }

    .settings {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 8px;
    }

    .small {
      font-size: 13px;
      color: #6b7280;
      margin-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>🎯 Ade Focus Timer</h1>

      <div class="subtitle">
        Stay focused. Work deliberately.
      </div>

      <div class="label" id="timerLabel">
        No active timer
      </div>

      <div class="timer" id="timer">
        25:00
      </div>

      <div class="status" id="status">
        Ready
      </div>

      <div class="controls">

        <button
          class="start"
          onclick="startTimer()">
          ▶ Start
        </button>

        <button
          class="pause"
          onclick="pauseTimer()">
          ⏸ Pause
        </button>

        <button
          class="resume"
          onclick="resumeTimer()">
          ▶ Resume
        </button>

        <button
          class="stop"
          onclick="stopTimer()">
          ■ Stop
        </button>

      </div>

      <div class="settings">

        <label for="duration">
          Timer duration (minutes)
        </label>

        <input
          id="duration"
          type="number"
          min="1"
          max="1440"
          value="25">

        <button
          class="notification"
          onclick="enableNotifications()">
          🔔 Enable Notifications
        </button>

      </div>

      <div class="small">
        This timer synchronises with your Ade Focus Timer
        backend, so timers started from your GPT can also
        appear here.
      </div>

    </div>

  </div>


<script>

/* ==========================================
   CONFIGURATION
   ========================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbxJMMURG_zF__mEpvKLzTibUvELUgfO_8LyDaTMJKRVDkTsQtpHkt8hnXq_f8BLNpS4/exec';


/* ==========================================
   STATE
   ========================================== */

let currentTimer = null;

let currentLabel = '';

let completionHandled = false;

let backendPolling = null;

let displayInterval = null;


/* ==========================================
   JSONP API
   ========================================== */

function apiRequest(params) {

  return new Promise((resolve, reject) => {

    const callbackName =
      'timerCallback_' +
      Date.now() +
      '_' +
      Math.floor(Math.random() * 100000);

    const script =
      document.createElement('script');

    const query =
      new URLSearchParams({
        api: '1',
        callback: callbackName,
        ...params
      });

    const timeout =
      setTimeout(() => {

        cleanup();

        reject(
          new Error('Timer request timed out')
        );

      }, 10000);


    window[callbackName] =
      function(data) {

        clearTimeout(timeout);

        cleanup();

        resolve(data);

      };


    function cleanup() {

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    }


    script.onerror =
      function() {

        clearTimeout(timeout);

        cleanup();

        reject(
          new Error('Timer request failed')
        );

      };


    script.src =
      API_URL +
      '?' +
      query.toString();


    document.body.appendChild(script);

  });

}


/* ==========================================
   START TIMER
   ========================================== */

async function startTimer() {

  const durationInput =
    document.getElementById('duration');

  const minutes =
    Number(durationInput.value);


  if (
    !Number.isFinite(minutes) ||
    minutes < 1
  ) {

    setStatus(
      'Please enter a valid duration.'
    );

    return;

  }


  const durationSeconds =
    Math.round(minutes * 60);


  try {

    setStatus('Starting timer...');


    const result =
      await apiRequest({

        action: 'start',

        duration_seconds:
          durationSeconds,

        label:
          'Focus Block'

      });


    if (!result.ok) {

      setStatus(
        result.error ||
        'Unable to start timer.'
      );

      return;

    }


    completionHandled = false;

    currentLabel =
      result.label ||
      'Focus Block';


    updateDisplay(result);

    startDisplayClock();

    startBackendPolling();

  }


  catch (error) {

    setStatus(
      'Unable to connect to timer.'
    );

    console.error(error);

  }

}


/* ==========================================
   PAUSE TIMER
   ========================================== */

async function pauseTimer() {

  try {

    setStatus('Pausing...');


    const result =
      await apiRequest({
        action: 'pause'
      });


    if (!result.ok) {

      setStatus(
        result.error ||
        'Unable to pause timer.'
      );

      return;

    }


    updateDisplay(result);

    stopDisplayClock();

    setStatus('⏸ Timer paused.');

  }


  catch (error) {

    setStatus(
      'Unable to pause timer.'
    );

    console.error(error);

  }

}


/* ==========================================
   RESUME TIMER
   ========================================== */

async function resumeTimer() {

  try {

    setStatus('Resuming...');


    const result =
      await apiRequest({
        action: 'resume'
      });


    if (!result.ok) {

      setStatus(
        result.error ||
        'Unable to resume timer.'
      );

      return;

    }


    completionHandled = false;

    updateDisplay(result);

    startDisplayClock();

    startBackendPolling();

  }


  catch (error) {

    setStatus(
      'Unable to resume timer.'
    );

    console.error(error);

  }

}


/* ==========================================
   STOP TIMER
   ========================================== */

async function stopTimer() {

  try {

    const result =
      await apiRequest({
        action: 'stop'
      });


    if (!result.ok) {

      setStatus(
        result.error ||
        'Unable to stop timer.'
      );

      return;

    }


    stopBackendPolling();

    stopDisplayClock();


    currentTimer = null;

    currentLabel = '';

    completionHandled = false;


    document.getElementById(
      'timer'
    ).textContent = '25:00';


    document.getElementById(
      'timerLabel'
    ).textContent =
      'No active timer';


    document.title =
      'Ade Focus Timer';


    setStatus('Timer stopped.');

  }


  catch (error) {

    setStatus(
      'Unable to stop timer.'
    );

    console.error(error);

  }

}


/* ==========================================
   GET STATUS
   ========================================== */

async function getStatus() {

  try {

    const result =
      await apiRequest({
        action: 'status'
      });


    if (!result.ok) {

      return;

    }


    if (
      result.active &&
      !result.paused
    ) {

      currentLabel =
        result.label ||
        'Focus Block';


      updateDisplay(result);

      startDisplayClock();

      startBackendPolling();

      return;

    }


    if (
      result.active &&
      result.paused
    ) {

      updateDisplay(result);

      stopDisplayClock();

      stopBackendPolling();

      return;

    }


    if (
      !result.active &&
      result.completed
    ) {

      if (!completionHandled) {

        completionHandled = true;

        finishTimer(
          true,
          result.label ||
          currentLabel ||
          'Focus Block'
        );

      }

      return;

    }


    if (!result.active) {

      stopDisplayClock();

      stopBackendPolling();

      updateIdleState();

    }

  }


  catch (error) {

    console.error(
      'Status check failed:',
      error
    );

  }

}


/* ==========================================
   UPDATE DISPLAY FROM BACKEND
   ========================================== */

function updateDisplay(state) {

  currentTimer =
    state;


  currentLabel =
    state.label ||
    currentLabel ||
    'Focus Block';


  document.getElementById(
    'timerLabel'
  ).textContent =
    currentLabel;


  /*
   * For an active timer we use ends_at
   * as the authoritative time source.
   */

  if (
    state.active &&
    !state.paused &&
    state.ends_at
  ) {

    currentTimer.ends_at =
      state.ends_at;

  }


  /*
   * For a paused timer we use the stored
   * remaining_seconds value.
   */

  if (state.paused) {

    renderTime(
      Number(
        state.remaining_seconds || 0
      )
    );


    setStatus(
      '⏸ Timer paused'
    );

    return;

  }


  if (
    state.active &&
    state.ends_at
  ) {

    updateDisplayFromEndTime();

    setStatus(
      '⏱ Timer running'
    );

  }

}


/* ==========================================
   LOCAL DISPLAY CLOCK
   ========================================== */

function startDisplayClock() {

  stopDisplayClock();


  updateDisplayFromEndTime();


  /*
   * Update the visible countdown every second.
   */

  displayInterval =
    setInterval(
      updateDisplayFromEndTime,
      1000
    );

}


/* ==========================================
   STOP LOCAL DISPLAY CLOCK
   ========================================== */

function stopDisplayClock() {

  if (displayInterval) {

    clearInterval(
      displayInterval
    );

    displayInterval = null;

  }

}


/* ==========================================
   UPDATE FROM END TIME
   ========================================== */

function updateDisplayFromEndTime() {

  if (
    !currentTimer ||
    currentTimer.paused ||
    !currentTimer.ends_at
  ) {

    return;

  }


  const remaining =
    Math.max(
      0,
      Math.ceil(
        (
          Date.parse(
            currentTimer.ends_at
          ) -
          Date.now()
        ) / 1000
      )
    );


  renderTime(
    remaining
  );


  /*
   * Local countdown reached zero.
   *
   * We don't immediately assume completion
   * until we check the backend.
   */

  if (
    remaining <= 0 &&
    !completionHandled
  ) {

    checkTimer();

  }

}


/* ==========================================
   RENDER TIME
   ========================================== */

function renderTime(seconds) {

  seconds =
    Math.max(
      0,
      Math.ceil(seconds)
    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  const remainingSeconds =
    seconds % 60;


  const formatted =
    String(minutes).padStart(2, '0') +
    ':' +
    String(
      remainingSeconds
    ).padStart(2, '0');


  document.getElementById(
    'timer'
  ).textContent =
    formatted;


  document.title =
    formatted +
    ' — Ade Focus Timer';

}


/* ==========================================
   BACKEND POLLING
   ========================================== */

function startBackendPolling() {

  if (backendPolling) {

    return;

  }


  /*
   * Backend synchronisation every 5 seconds.
   * The visible countdown itself runs every second.
   */

  backendPolling =
    setInterval(
      checkTimer,
      5000
    );

}


/* ==========================================
   STOP BACKEND POLLING
   ========================================== */

function stopBackendPolling() {

  if (backendPolling) {

    clearInterval(
      backendPolling
    );

    backendPolling = null;

  }

}


/* ==========================================
   CHECK TIMER
   ========================================== */

async function checkTimer() {

  try {

    const result =
      await apiRequest({
        action: 'status'
      });


    if (!result.ok) {

      return;

    }


    /*
     * Active timer.
     */

    if (
      result.active &&
      !result.paused
    ) {

      currentLabel =
        result.label ||
        currentLabel ||
        'Focus Block';


      /*
       * Refresh the authoritative end time.
       */

      currentTimer =
        result;


      currentTimer.ends_at =
        result.ends_at;


      document.getElementById(
        'timerLabel'
      ).textContent =
        currentLabel;


      updateDisplayFromEndTime();

      return;

    }


    /*
     * Paused timer.
     */

    if (
      result.active &&
      result.paused
    ) {

      currentTimer =
        result;


      currentLabel =
        result.label ||
        currentLabel ||
        'Focus Block';


      updateDisplay(result);

      stopDisplayClock();

      return;

    }


    /*
     * Completed timer.
     */

    if (
      !result.active &&
      result.completed
    ) {

      if (!completionHandled) {

        completionHandled = true;

        finishTimer(
          true,
          result.label ||
          currentLabel ||
          'Focus Block'
        );

      }

      return;

    }


    /*
     * No timer.
     */

    if (!result.active) {

      stopDisplayClock();

      stopBackendPolling();

      updateIdleState();

    }

  }


  catch (error) {

    console.error(
      'Polling error:',
      error
    );

  }

}


/* ==========================================
   IDLE STATE
   ========================================== */

function updateIdleState() {

  currentTimer = null;


  document.getElementById(
    'timerLabel'
  ).textContent =
    'No active timer';


  setStatus(
    'Ready'
  );


  document.title =
    'Ade Focus Timer';

}


/* ==========================================
   TIMER COMPLETION
   ========================================== */

function finishTimer(
  notify = true,
  label = 'Focus Block'
) {

  stopDisplayClock();

  stopBackendPolling();


  renderTime(0);


  document.getElementById(
    'timerLabel'
  ).textContent =
    label;


  setStatus(
    '🎉 Timer complete!'
  );


  /*
   * Gentle three-note chime.
   */

  beep();


  /*
   * Browser notification.
   */

  if (notify) {

    showNotification(
      label
    );

  }


  /*
   * Clear the timer on the backend.
   */

  apiRequest({
    action: 'stop'
  }).catch(
    error =>
      console.error(
        'Unable to clear completed timer:',
        error
      )
  );

}


/* ==========================================
   GENTLE COMPLETION CHIME
   ========================================== */

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {

      return;

    }


    const audio =
      new AudioContext();


    /*
     * C5 → E5 → G5
     *
     * Gentle ascending
     * three-note chime.
     */

    const notes = [

      {
        frequency: 523.25,
        start: 0,
        duration: 0.35
      },

      {
        frequency: 659.25,
        start: 0.22,
        duration: 0.35
      },

      {
        frequency: 783.99,
        start: 0.44,
        duration: 0.65
      }

    ];


    notes.forEach(
      note => {

        const oscillator =
          audio.createOscillator();


        const gain =
          audio.createGain();


        oscillator.type =
          'sine';


        oscillator.frequency.value =
          note.frequency;


        oscillator.connect(
          gain
        );


        gain.connect(
          audio.destination
        );


        const startTime =
          audio.currentTime +
          note.start;


        gain.gain.setValueAtTime(
          0,
          startTime
        );


        gain.gain.linearRampToValueAtTime(
          0.12,
          startTime + 0.04
        );


        gain.gain.exponentialRampToValueAtTime(
          0.001,
          startTime +
          note.duration
        );


        oscillator.start(
          startTime
        );


        oscillator.stop(
          startTime +
          note.duration
        );

      }
    );


    setTimeout(
      () => {

        audio.close();

      },
      1600
    );

  }


  catch (error) {

    console.error(
      'Unable to play completion chime:',
      error
    );

  }

}


/* ==========================================
   ENABLE NOTIFICATIONS
   ========================================== */

async function enableNotifications() {

  if (
    !('Notification' in window)
  ) {

    alert(
      'Browser notifications are not supported on this device.'
    );

    return;

  }


  try {

    const permission =
      await Notification.requestPermission();


    if (
      permission === 'granted'
    ) {

      new Notification(
        'Ade Focus Timer',
        {
          body:
            'Notifications are now enabled.'
        }
      );


      setStatus(
        '🔔 Notifications enabled.'
      );

    }

    else {

      setStatus(
        '🔕 Notifications are blocked.'
      );

    }

  }


  catch (error) {

    console.error(
      error
    );

    setStatus(
      'Unable to enable notifications.'
    );

  }

}


/* ==========================================
   SHOW COMPLETION NOTIFICATION
   ========================================== */

function showNotification(
  label
) {

  if (
    !('Notification' in window)
  ) {

    return;

  }


  if (
    Notification.permission !==
    'granted'
  ) {

    return;

  }


  try {

    new Notification(
      '🎉 Focus Block Complete',
      {
        body:
          label +
          ' has finished. Time to review your progress or take a short break.',

        tag:
          'ade-focus-timer'
      }
    );

  }


  catch (error) {

    console.error(
      'Notification error:',
      error
    );

  }

}


/* ==========================================
   STATUS HELPER
   ========================================== */

function setStatus(
  message
) {

  document.getElementById(
    'status'
  ).textContent =
    message;

}


/* ==========================================
   INITIAL LOAD
   ========================================== */

window.addEventListener(
  'load',
  () => {

    getStatus();

  }
);

</script>

</body>
</html>
