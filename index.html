<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ade Focus Timer</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background:
        #f4f5f7;

      color:
        #111827;

    }


    .container {

      width: 100%;

      max-width: 520px;

      padding: 24px;

    }


    .card {

      background: white;

      border-radius: 20px;

      padding: 32px;

      box-shadow:
        0 10px 35px rgba(0,0,0,0.08);

      text-align: center;

    }


    h1 {

      margin:
        0 0 8px;

      font-size: 28px;

      font-weight: 700;

    }


    .subtitle {

      margin:
        0 0 28px;

      color:
        #6b7280;

      font-size: 14px;

    }


    .timer {

      font-size: 76px;

      font-weight: 700;

      letter-spacing: -3px;

      margin:
        20px 0;

      font-variant-numeric:
        tabular-nums;

    }


    .label {

      font-size: 17px;

      font-weight: 600;

      min-height: 24px;

      margin-bottom: 8px;

    }


    .status {

      font-size: 14px;

      color:
        #6b7280;

      min-height: 22px;

      margin-bottom: 22px;

    }


    .controls {

      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      justify-content: center;

      margin-top: 20px;

    }


    button {

      border: none;

      border-radius: 10px;

      padding:
        12px 18px;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;

      background:
        #111827;

      color: white;

      transition:
        transform 0.1s ease,
        opacity 0.1s ease;

    }


    button:hover {

      opacity: 0.9;

    }


    button:active {

      transform:
        scale(0.97);

    }


    button:disabled {

      opacity:
        0.45;

      cursor:
        not-allowed;

    }


    .secondary {

      background:
        #e5e7eb;

      color:
        #111827;

    }


    .danger {

      background:
        #b91c1c;

    }


    .sound-button {

      margin-top: 18px;

      width: 100%;

      background:
        #374151;

    }


    .notification-status {

      margin-top: 10px;

      font-size: 13px;

      color:
        #6b7280;

    }


    .duration-row {

      display: flex;

      gap: 10px;

      margin-top: 20px;

    }


    input {

      flex: 1;

      min-width: 0;

      border:
        1px solid #d1d5db;

      border-radius: 10px;

      padding:
        12px;

      font-size: 15px;

      text-align: center;

    }


    .start-manual {

      background:
        #2563eb;

    }


    .footer {

      margin-top: 24px;

      font-size: 12px;

      color:
        #9ca3af;

      line-height: 1.5;

    }


    @media (max-width: 480px) {

      .card {

        padding: 24px;

      }

      .timer {

        font-size: 60px;

      }

    }

  </style>

</head>


<body>


<div class="container">

  <div class="card">


    <h1>
      Ade Focus Timer
    </h1>


    <p class="subtitle">
      Shared with your GPT focus assistant
    </p>


    <div
      id="label"
      class="label"
    >
      No active timer
    </div>


    <div
      id="timer"
      class="timer"
    >
      00:00
    </div>


    <div
      id="status"
      class="status"
    >
      Ready
    </div>


    <div class="controls">

      <button
        id="pauseButton"
        onclick="pauseTimer()"
        disabled
      >
        Pause
      </button>


      <button
        id="resumeButton"
        onclick="resumeTimer()"
        disabled
      >
        Resume
      </button>


      <button
        id="stopButton"
        onclick="stopTimer()"
        disabled
        class="danger"
      >
        Stop
      </button>

    </div>


    <div class="duration-row">

      <input
        id="durationInput"
        type="number"
        min="1"
        max="86400"
        value="25"
        placeholder="Minutes"
      >


      <button
        class="start-manual"
        onclick="startManualTimer()"
      >
        Start
      </button>

    </div>


    <button
      id="alertButton"
      class="sound-button"
      onclick="enableAlerts()"
    >
      🔔 Enable Sound & Notifications
    </button>


    <div
      id="notificationStatus"
      class="notification-status"
    >
      Alerts not enabled
    </div>


    <div class="footer">

      Keep this page open in a browser tab.
      The timer state is controlled by the GPT and
      synchronised through the timer server.

    </div>


  </div>

</div>



<script>


/* =========================================================
   CONFIGURATION
   ========================================================= */


const API_URL =
  "https://script.google.com/macros/s/AKfycbxJMMURG_zF__mEpvKLzTibUvELUgfO_8LyDaTMJKRVDkTsQtpHkt8hnXq_f8BLNpS4/exec";


/*
 * Poll the Apps Script backend every 5 seconds.
 *
 * The backend remains the source of truth.
 */

const POLL_INTERVAL =
  5000;


/* =========================================================
   STATE
   ========================================================= */


let currentTimer =
  null;


let displayInterval =
  null;


let backendPolling =
  null;


let audioContext =
  null;


let audioUnlocked =
  false;


let lastCompletedTimer =
  null;


let lastKnownEndsAt =
  null;



/* =========================================================
   DOM
   ========================================================= */


const timerElement =
  document.getElementById(
    "timer"
  );


const labelElement =
  document.getElementById(
    "label"
  );


const statusElement =
  document.getElementById(
    "status"
  );


const pauseButton =
  document.getElementById(
    "pauseButton"
  );


const resumeButton =
  document.getElementById(
    "resumeButton"
  );


const stopButton =
  document.getElementById(
    "stopButton"
  );


const notificationStatus =
  document.getElementById(
    "notificationStatus"
  );


const alertButton =
  document.getElementById(
    "alertButton"
  );


/* =========================================================
   AUDIO INITIALISATION
   ========================================================= */


/*
 * Create the AudioContext after a user interaction.
 *
 * This is important because Chrome/Safari can block
 * audio that starts without a user gesture.
 */


function initialiseAudio() {

  try {

    if (!audioContext) {

      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContextClass) {

        return false;

      }

      audioContext =
        new AudioContextClass();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    audioUnlocked =
      true;

    return true;

  }

  catch (error) {

    console.error(
      "Audio initialisation failed:",
      error
    );

    return false;

  }

}


/* =========================================================
   LOUD COMPLETION ALERT
   ========================================================= */


/*
 * Plays one attention burst.
 *
 * Several tones are layered so the sound is much more
 * noticeable than the previous single gentle beep.
 */


function playAlertBurst() {

  if (!audioContext) {

    if (!initialiseAudio()) {

      return;

    }

  }


  try {

    const now =
      audioContext.currentTime;


    const master =
      audioContext.createGain();


    master.gain.setValueAtTime(
      0.0001,
      now
    );


    master.gain.exponentialRampToValueAtTime(
      0.8,
      now + 0.03
    );


    master.gain.exponentialRampToValueAtTime(
      0.0001,
      now + 0.55
    );


    master.connect(
      audioContext.destination
    );


    /*
     * First tone
     */

    const oscillator1 =
      audioContext.createOscillator();


    oscillator1.type =
      "sine";


    oscillator1.frequency.setValueAtTime(
      880,
      now
    );


    oscillator1.connect(
      master
    );


    oscillator1.start(
      now
    );


    oscillator1.stop(
      now + 0.22
    );


    /*
     * Second tone
     */

    const oscillator2 =
      audioContext.createOscillator();


    oscillator2.type =
      "sine";


    oscillator2.frequency.setValueAtTime(
      1174.66,
      now + 0.18
    );


    oscillator2.connect(
      master
    );


    oscillator2.start(
      now + 0.18
    );


    oscillator2.stop(
      now + 0.42
    );


    /*
     * Third higher tone.
     */

    const oscillator3 =
      audioContext.createOscillator();


    oscillator3.type =
      "triangle";


    oscillator3.frequency.setValueAtTime(
      1396.91,
      now + 0.36
    );


    oscillator3.connect(
      master
    );


    oscillator3.start(
      now + 0.36
    );


    oscillator3.stop(
      now + 0.55
    );


  }

  catch (error) {

    console.error(
      "Could not play alert:",
      error
    );

  }

}


/*
 * Three separate alert bursts.
 *
 * This makes the completion considerably harder to miss.
 */


function playCompletionSound() {

  initialiseAudio();


  /*
   * First burst immediately.
   */

  playAlertBurst();


  /*
   * Second burst.
   */

  setTimeout(
    () => {

      playAlertBurst();

    },
    800
  );


  /*
   * Third burst.
   */

  setTimeout(
    () => {

      playAlertBurst();

    },
    1600
  );

}


/* =========================================================
   ENABLE ALERTS
   ========================================================= */


async function enableAlerts() {

  /*
   * Unlock audio through a direct user interaction.
   */

  initialiseAudio();


  /*
   * Request browser notification permission.
   */

  if (
    "Notification" in window
  ) {

    try {

      const permission =
        await Notification.requestPermission();


      updateNotificationStatus(
        permission
      );

    }

    catch (error) {

      console.error(
        "Notification permission error:",
        error
      );

      updateNotificationStatus(
        "error"
      );

    }

  }

  else {

    notificationStatus.textContent =
      "Browser notifications are not supported.";

  }


  /*
   * Give the user a small confirmation sound.
   */

  playAlertBurst();


  alertButton.textContent =
    "🔔 Alerts Enabled";


  alertButton.disabled =
    false;

}


/* =========================================================
   NOTIFICATION STATUS
   ========================================================= */


function updateNotificationStatus(
  permission
) {

  if (
    permission ===
    "granted"
  ) {

    notificationStatus.textContent =
      "🔔 Notifications enabled • loud completion alert enabled";

  }

  else if (
    permission ===
    "denied"
  ) {

    notificationStatus.textContent =
      "🔕 Notifications are blocked in browser settings";

  }

  else {

    notificationStatus.textContent =
      "Notifications not enabled";

  }

}


/* =========================================================
   BROWSER NOTIFICATION
   ========================================================= */


function showCompletionNotification(
  label
) {

  if (
    !("Notification" in window)
  ) {

    return;

  }


  if (
    Notification.permission !==
    "granted"
  ) {

    return;

  }


  try {

    const notification =
      new Notification(
        "🔔 Focus block complete",
        {
          body:
            label
              ? label +
                " is complete."
              : "Your focus block is complete.",

          icon:
            "https://mellow-blancmange-e3aeb9.netlify.app/favicon.ico",

          tag:
            "ade-focus-timer-complete",

          renotify:
            true,

          requireInteraction:
            true
        }
      );


    notification.onclick =
      function() {

        window.focus();

        notification.close();

      };


  }

  catch (error) {

    console.error(
      "Notification failed:",
      error
    );

  }

}


/* =========================================================
   COMPLETION HANDLER
   ========================================================= */


function handleTimerCompleted(
  label
) {

  /*
   * Prevent duplicate notifications if the same completed
   * timer is returned by more than one poll.
   */

  const completionKey =
    String(
      lastKnownEndsAt ||
      label ||
      Date.now()
    );


  if (
    lastCompletedTimer ===
    completionKey
  ) {

    return;

  }


  lastCompletedTimer =
    completionKey;


  currentTimer =
    null;


  stopDisplayClock();


  timerElement.textContent =
    "00:00";


  labelElement.textContent =
    label ||
    "Focus block complete";


  statusElement.textContent =
    "Completed";


  updateButtons(
    false,
    false,
    false
  );


  /*
   * Browser notification.
   */

  showCompletionNotification(
    label
  );


  /*
   * Loud three-burst sound.
   */

  playCompletionSound();


  /*
   * Change browser title.
   */

  document.title =
    "🔔 Focus block complete";


  /*
   * Return title to normal after 10 seconds.
   */

  setTimeout(
    () => {

      document.title =
        "Ade Focus Timer";

    },
    10000
  );

}


/* =========================================================
   API JSONP
   ========================================================= */


/*
 * Apps Script is queried using JSONP because ordinary
 * browser fetch requests can be blocked by CORS.
 */


function callApi(
  action,
  params = {}
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const callbackName =
        "timerCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams();


      query.set(
        "api",
        "1"
      );


      query.set(
        "action",
        action
      );


      query.set(
        "callback",
        callbackName
      );


      Object.keys(
        params
      ).forEach(
        key => {

          if (
            params[key] !==
            undefined &&
            params[key] !==
            null
          ) {

            query.set(
              key,
              params[key]
            );

          }

        }
      );


      window[callbackName] =
        function(data) {

          cleanup();

          resolve(
            data
          );

        };


      function cleanup() {

        delete window[
          callbackName
        ];


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }

      }


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              "Timer API request failed"
            )
          );

        };


      script.src =
        API_URL +
        "?" +
        query.toString();


      document.body.appendChild(
        script
      );

    }
  );

}


/* =========================================================
   START TIMER
   ========================================================= */


async function startTimer(
  durationSeconds,
  label
) {

  /*
   * If the timer page itself is used to start a timer,
   * unlock audio.
   */

  initialiseAudio();


  try {

    const result =
      await callApi(
        "start",
        {
          duration_seconds:
            durationSeconds,

          label:
            label ||
            "Focus Block"
        }
      );


    processTimerState(
      result
    );

  }

  catch (error) {

    console.error(
      error
    );

    statusElement.textContent =
      "Unable to start timer";

  }

}


/* =========================================================
   MANUAL START
   ========================================================= */


function startManualTimer() {

  initialiseAudio();


  const minutes =
    Number(
      document.getElementById(
        "durationInput"
      ).value
    );


  if (
    !Number.isFinite(minutes) ||
    minutes <= 0
  ) {

    alert(
      "Please enter a valid number of minutes."
    );

    return;

  }


  const seconds =
    Math.round(
      minutes * 60
    );


  startTimer(
    seconds,
    "Focus Block"
  );

}


/* =========================================================
   PAUSE
   ========================================================= */


async function pauseTimer() {

  try {

    const result =
      await callApi(
        "pause"
      );


    processTimerState(
      result
    );

  }

  catch (error) {

    console.error(
      error
    );

  }

}


/* =========================================================
   RESUME
   ========================================================= */


async function resumeTimer() {

  try {

    const result =
      await callApi(
        "resume"
      );


    processTimerState(
      result
    );

  }

  catch (error) {

    console.error(
      error
    );

  }

}


/* =========================================================
   STOP
   ========================================================= */


async function stopTimer() {

  try {

    const result =
      await callApi(
        "stop"
      );


    currentTimer =
      null;


    lastKnownEndsAt =
      null;


    stopDisplayClock();


    timerElement.textContent =
      "00:00";


    labelElement.textContent =
      "No active timer";


    statusElement.textContent =
      "Stopped";


    updateButtons(
      false,
      false,
      false
    );


    document.title =
      "Ade Focus Timer";


  }

  catch (error) {

    console.error(
      error
    );

  }

}


/* =========================================================
   STATUS
   ========================================================= */


async function getStatus() {

  try {

    const result =
      await callApi(
        "status"
      );


    processTimerState(
      result
    );

  }

  catch (error) {

    console.error(
      "Status check failed:",
      error
    );

  }

}


/* =========================================================
   PROCESS TIMER STATE
   ========================================================= */


function processTimerState(
  result
) {

  if (!result) {

    return;

  }


  /*
   * Timer completed.
   */

  if (
    result.completed ===
    true
  ) {

    handleTimerCompleted(
      result.label
    );

    return;

  }


  /*
   * No active timer.
   */

  if (
    result.active !==
    true
  ) {

    currentTimer =
      null;


    stopDisplayClock();


    timerElement.textContent =
      "00:00";


    labelElement.textContent =
      "No active timer";


    statusElement.textContent =
      "Ready";


    updateButtons(
      false,
      false,
      false
    );


    return;

  }


  /*
   * Active or paused timer.
   */

  currentTimer =
    result;


  lastKnownEndsAt =
    result.ends_at ||
    null;


  labelElement.textContent =
    result.label ||
    "Focus Block";


  /*
   * Paused timer.
   */

  if (
    result.paused ===
    true
  ) {

    stopDisplayClock();


    timerElement.textContent =
      formatTime(
        result.remaining_seconds
      );


    statusElement.textContent =
      "Paused";


    updateButtons(
      false,
      true,
      true
    );


    document.title =
      "⏸ " +
      formatTime(
        result.remaining_seconds
      ) +
      " • Focus Timer";


    return;

  }


  /*
   * Active timer.
   */

  statusElement.textContent =
    "Running";


  updateButtons(
    true,
    false,
    true
  );


  startDisplayClock();

}


/* =========================================================
   DISPLAY CLOCK
   ========================================================= */


function startDisplayClock() {

  if (
    displayInterval
  ) {

    return;

  }


  updateDisplay();


  displayInterval =
    setInterval(
      updateDisplay,
      1000
    );

}


/* =========================================================
   STOP DISPLAY CLOCK
   ========================================================= */


function stopDisplayClock() {

  if (
    displayInterval
  ) {

    clearInterval(
      displayInterval
    );

    displayInterval =
      null;

  }

}


/* =========================================================
   UPDATE DISPLAY
   ========================================================= */


function updateDisplay() {

  if (
    !currentTimer ||
    currentTimer.paused ||
    !currentTimer.ends_at
  ) {

    return;

  }


  const remaining =
    Math.max(
      0,
      Math.ceil(
        (
          Date.parse(
            currentTimer.ends_at
          ) -
          Date.now()
        ) / 1000
      )
    );


  timerElement.textContent =
    formatTime(
      remaining
    );


  document.title =
    formatTime(
      remaining
    ) +
    " • " +
    (
      currentTimer.label ||
      "Focus Timer"
    );


  if (
    remaining <= 0
  ) {

    /*
     * Don't immediately play the sound here.
     *
     * The backend status check determines completion.
     */

    timerElement.textContent =
      "00:00";

  }

}


/* =========================================================
   FORMAT TIME
   ========================================================= */


function formatTime(
  totalSeconds
) {

  totalSeconds =
    Math.max(
      0,
      Math.floor(
        Number(
          totalSeconds
        ) || 0
      )
    );


  const hours =
    Math.floor(
      totalSeconds / 3600
    );


  const minutes =
    Math.floor(
      (
        totalSeconds % 3600
      ) / 60
    );


  const seconds =
    totalSeconds % 60;


  if (
    hours > 0
  ) {

    return (
      String(hours)
        .padStart(2, "0") +
      ":" +
      String(minutes)
        .padStart(2, "0") +
      ":" +
      String(seconds)
        .padStart(2, "0")
    );

  }


  return (
    String(minutes)
      .padStart(2, "0") +
    ":" +
    String(seconds)
      .padStart(2, "0")
  );

}


/* =========================================================
   BUTTON STATES
   ========================================================= */


function updateButtons(
  canPause,
  canResume,
  canStop
) {

  pauseButton.disabled =
    !canPause;


  resumeButton.disabled =
    !canResume;


  stopButton.disabled =
    !canStop;

}


/* =========================================================
   BACKEND POLLING
   ========================================================= */


/*
 * IMPORTANT:
 *
 * This polling deliberately remains active even when there
 * is no timer. That means the page can detect a timer that
 * was started remotely by the GPT.
 */


function ensureBackendPolling() {

  if (
    backendPolling
  ) {

    return;

  }


  backendPolling =
    setInterval(
      checkTimer,
      POLL_INTERVAL
    );

}


/* =========================================================
   CHECK TIMER
   ========================================================= */


async function checkTimer() {

  try {

    const result =
      await callApi(
        "status"
      );


    processTimerState(
      result
    );

  }

  catch (error) {

    /*
     * Do not interrupt the timer if a single poll fails.
     */

    console.warn(
      "Timer polling failed:",
      error
    );

  }

}


/* =========================================================
   PAGE VISIBILITY
   ========================================================= */


/*
 * When the user returns to the timer page, immediately
 * synchronise rather than waiting for the next poll.
 */


document.addEventListener(
  "visibilitychange",
  () => {

    if (
      !document.hidden
    ) {

      getStatus();

    }

  }
);


/* =========================================================
   PAGE LOAD
   ========================================================= */


/*
 * Start remote polling immediately.
 *
 * This is what allows the GPT to start a timer while the
 * user is working in another browser tab.
 */


window.addEventListener(
  "load",
  () => {

    ensureBackendPolling();

    getStatus();


    /*
     * Reflect existing notification permission.
     */

    if (
      "Notification" in window
    ) {

      updateNotificationStatus(
        Notification.permission
      );

    }

  }
);


/* =========================================================
   OPTIONAL AUDIO UNLOCK
   ========================================================= */


/*
 * Any click on the page is an opportunity to unlock audio.
 *
 * This is useful because browsers restrict autoplay audio.
 */


document.addEventListener(
  "click",
  () => {

    if (
      !audioUnlocked
    ) {

      initialiseAudio();

    }

  },
  {
    once: false,
    passive: true
